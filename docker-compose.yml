services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.php
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./:/var/www/html
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: mg_multiservice
      MYSQL_USER: mg_user
      MYSQL_PASSWORD: mg_local_only_change_me
      MYSQL_ROOT_PASSWORD: mg_local_root_only_change_me
    volumes:
      - mg_php_db:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mg_php_db:
